<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Shuffle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#120c1e;
    --bg-1:#1c1430;
    --bg-2:#271b42;
    --bg-3:#31234f;
    --border:#392a5c;
    --violet:#8b5cf6;
    --violet-hi:#a480ff;
    --coral:#ff7b54;
    --text-hi:#f5f1ff;
    --text-lo:#a599c7;
    --text-dim:#7c6fa0;
  }
  html,body{margin:0;background:var(--bg-0);color:var(--text-hi);
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);box-sizing:border-box;}
  body{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  *,*::before,*::after{box-sizing:inherit;}
  h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;}
  button{font-family:inherit;color:inherit;}
  svg{display:block;}
  :focus-visible{outline:2px solid var(--violet-hi);outline-offset:2px;}

  .stage{max-width:860px;margin:0 auto;padding:0 20px;text-align:center;}

  /* ---------- top bar ---------- */
  header.top{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
    background:rgba(18,12,30,.88);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .bar{max-width:860px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;}
  .mini-logo{display:flex;align-items:center;gap:9px;background:none;border:none;cursor:pointer;padding:4px 0;}
  .mini-logo svg{width:30px;height:30px;}
  .mini-logo span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;}
  nav{display:flex;gap:4px;}
  .nav-btn{background:none;border:none;color:var(--text-lo);font-size:14px;font-weight:500;
    padding:8px 15px;border-radius:999px;cursor:pointer;}
  .nav-btn:hover{color:var(--text-hi);background:var(--bg-2);}
  .nav-btn.active{color:var(--text-hi);background:var(--bg-2);}

  .view{display:none;}
  .view.active{display:block;}

  /* ---------- hero ---------- */
  .hero{padding:44px 0 26px;}
  .hero .logo-big{width:96px;height:96px;margin:0 auto 14px;filter:drop-shadow(0 10px 24px rgba(139,92,246,.35));}
  .hero h1{font-size:clamp(34px,7vw,52px);font-weight:700;letter-spacing:-.02em;line-height:1.05;}
  .hero p{color:var(--text-lo);font-size:clamp(16px,3.4vw,19px);margin:10px 0 0;}

  /* ---------- filter box ---------- */
  .filters{background:var(--bg-1);border:1px solid var(--border);border-radius:20px;padding:22px 18px 24px;}
  .filters h3{font-size:14px;font-weight:600;color:var(--text-lo);margin-bottom:12px;font-family:'Inter',sans-serif;}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;}
  .chips + h3{margin-top:22px;}
  .chip{background:var(--bg-0);border:1px solid var(--border);color:var(--text-lo);
    padding:8px 15px;border-radius:999px;font-size:13.5px;font-weight:500;cursor:pointer;transition:all .14s;}
  .chip:hover{border-color:var(--violet);color:var(--text-hi);}
  .chip.on{background:var(--violet);border-color:var(--violet);color:#fff;}

  /* ---------- shuffle button ---------- */
  .shuffle-zone{padding:30px 0 10px;}
  .shuffle-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:12px;
    min-width:min(320px,100%);padding:20px 40px;border:none;cursor:pointer;
    border-radius:999px;color:#fff;font-weight:700;font-size:20px;
    font-family:'Space Grotesk',sans-serif;
    background:linear-gradient(160deg,var(--coral),#e0552e);
    box-shadow:0 7px 0 #b1401f,0 16px 30px rgba(224,85,46,.32);
    transition:transform .1s,box-shadow .1s;
  }
  .shuffle-btn:hover{transform:translateY(-2px);}
  .shuffle-btn:active{transform:translateY(6px);box-shadow:0 1px 0 #b1401f;}
  .shuffle-btn svg{width:26px;height:26px;}
  .shuffle-btn:focus-visible{outline-color:#fff;outline-offset:4px;}
  .match-count{color:var(--text-dim);font-size:13.5px;margin:20px 0 0;}

  /* ---------- game cards (uma peça só) ---------- */
  .list-title{font-size:22px;margin:34px 0 18px;}
  .cards{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;padding-bottom:70px;}
  .game-card{
    position:relative;width:176px;aspect-ratio:3/4;border-radius:16px;overflow:hidden;
    border:1px solid var(--border);cursor:pointer;text-align:left;background:var(--bg-2);
    transition:transform .15s,border-color .15s;
  }
  .game-card:hover{transform:translateY(-3px);border-color:var(--violet);}
  .game-card .art{position:absolute;inset:0;}
  .game-card .art svg{width:100%;height:100%;}
  /* capa real (Steam / Wikipédia) sobre a capa gerada; se falhar, a gerada continua visível */
  .game-card .art img,.r-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .25s;background:var(--bg-2);}
  .game-card .art img.ok,.r-cover img.ok{opacity:1;}
  /* imagens horizontais (logos) aparecem inteiras sobre a capa gerada */
  .game-card .art img.logo{object-fit:contain;padding:22% 12% 42%;background:transparent;}
  .r-cover img.logo{object-fit:contain;object-position:center;padding:14%;background:transparent;}
  .art:has(img.logo) svg text,.r-cover:has(img.logo) svg text{display:none;}
  .game-card .info{
    position:absolute;left:0;right:0;bottom:0;padding:36px 12px 12px;
    background:linear-gradient(to top,rgba(10,6,18,.92) 30%,rgba(10,6,18,0));
  }
  .game-card h3{font-size:14.5px;font-weight:600;line-height:1.2;margin-bottom:5px;}
  .game-card .row{display:flex;justify-content:space-between;align-items:center;}
  .game-card .yr{font-size:12px;color:var(--text-lo);}
  .stars{display:flex;gap:1px;}
  .stars svg{width:12px;height:12px;}
  .heart{
    position:absolute;top:9px;right:9px;width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(18,12,30,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;
  }
  .heart svg{width:15px;height:15px;}
  @media(max-width:520px){.game-card{width:calc(50% - 8px);}}

  /* ---------- result screen ---------- */
  .overlay{position:fixed;inset:0;z-index:60;background:rgba(9,6,15,.78);display:none;
    align-items:center;justify-content:center;padding:18px;
    padding-top:calc(18px + env(safe-area-inset-top,0px));
    padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));}
  .overlay.show{display:flex;}
  .result{position:relative;background:var(--bg-1);border:1px solid var(--border);border-radius:24px;
    width:100%;max-width:560px;max-height:100%;overflow-y:auto;padding:24px 22px 26px;text-align:center;}
  .close-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:none;
    background:var(--bg-2);cursor:pointer;font-size:15px;}
  .r-top{display:flex;gap:18px;align-items:center;text-align:left;margin-top:8px;}
  .r-cover{position:relative;width:min(200px,42%);aspect-ratio:1/1;border-radius:16px;overflow:hidden;flex-shrink:0;border:1px solid var(--border);}
  .r-cover img{transition:none;object-position:center top;}
  .r-cover svg{width:100%;height:100%;}
  .r-side{min-width:0;}
  .r-kicker{color:var(--coral);font-size:13px;font-weight:600;margin:0 0 6px;}
  .r-side h2{font-size:clamp(21px,5vw,27px);line-height:1.1;margin-bottom:10px;}
  .r-small{display:inline-flex;align-items:center;gap:10px;background:var(--bg-2);border:1px solid var(--border);
    border-radius:10px;padding:6px 11px;font-size:13px;color:var(--text-lo);}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .tag{font-size:11.5px;color:var(--text-lo);border:1px solid var(--border);padding:3px 9px;border-radius:999px;}
  .r-box{background:var(--bg-0);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin:20px 0 22px;text-align:left;}
  .r-box h4{font-size:13px;color:var(--text-dim);margin-bottom:7px;font-family:'Inter',sans-serif;font-weight:600;}
  .r-box p{margin:0;font-size:14.5px;line-height:1.6;color:var(--text-hi);}
  .r-actions{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .oval{border:none;cursor:pointer;border-radius:999px;font-weight:700;font-size:16px;padding:14px 34px;
    font-family:'Space Grotesk',sans-serif;color:#fff;background:var(--violet);box-shadow:0 4px 0 #5b3fc4;
    transition:transform .1s,box-shadow .1s;}
  .oval:active{transform:translateY(3px);box-shadow:0 1px 0 #5b3fc4;}
  .oval:disabled{opacity:.6;cursor:default;}
  .link-btn{background:none;border:none;color:var(--text-lo);font-size:14px;cursor:pointer;padding:6px 10px;}
  .link-btn:hover{color:var(--text-hi);}
  .result.rolling .r-cover svg,.result.rolling .r-cover img{filter:blur(1.5px);}
  @media(max-width:480px){.r-top{flex-direction:column;text-align:center;}.r-cover{width:60%;}.tags,.r-small{justify-content:center;}}

  /* ---------- profile ---------- */
  .profile{padding:42px 0 90px;}
  .avatar{width:92px;height:92px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--violet),var(--coral));font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:700;}
  .profile h1{font-size:26px;}
  .profile .sub{color:var(--text-lo);font-size:14.5px;margin:6px 0 22px;}
  .login-box{background:var(--bg-1);border:1px solid var(--border);border-radius:18px;padding:22px;max-width:420px;margin:0 auto 34px;text-align:left;}
  .login-box h3{font-size:16px;margin-bottom:4px;}
  .login-box .hint{color:var(--text-dim);font-size:13px;margin:0 0 16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:13px;color:var(--text-lo);margin-bottom:5px;}
  .field .opt{color:var(--text-dim);}
  .field input{width:100%;background:var(--bg-0);border:1px solid var(--border);border-radius:10px;color:var(--text-hi);
    padding:11px 13px;font-size:14.5px;font-family:inherit;}
  .login-box .oval{width:100%;margin-top:4px;}
  .logout{margin:0 auto 30px;}
  .fav-box{background:var(--bg-1);border:1px solid var(--border);border-radius:18px;padding:22px 16px 24px;}
  .fav-box h3{font-size:17px;margin-bottom:16px;}
  .fav-box .cards{padding-bottom:0;}
  .empty{color:var(--text-dim);font-size:14px;padding:14px 8px;}
  .empty strong{display:block;color:var(--text-lo);font-size:15px;margin-bottom:4px;font-weight:600;}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);
    background:var(--bg-3);border:1px solid var(--border);padding:11px 20px;border-radius:999px;font-size:13.5px;
    z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  footer{border-top:1px solid var(--border);padding:20px;color:var(--text-dim);font-size:12.5px;text-align:center;}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<!-- logo reutilizável -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lgV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a480ff"/><stop offset="1" stop-color="#5b3fc4"/>
    </linearGradient>
    <linearGradient id="lgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a76"/><stop offset="1" stop-color="#e0552e"/>
    </linearGradient>
    <symbol id="logo" viewBox="0 0 64 64">
      <g transform="rotate(15 32 32)"><rect x="17" y="7" width="33" height="46" rx="8" fill="url(#lgC)"/></g>
      <g transform="rotate(-11 32 32)">
        <rect x="13" y="10" width="36" height="47" rx="9" fill="url(#lgV)" stroke="#120c1e" stroke-width="2"/>
        <circle cx="23" cy="22" r="3.1" fill="#fff"/><circle cx="39" cy="22" r="3.1" fill="#fff"/>
        <circle cx="31" cy="33.5" r="3.1" fill="#fff"/>
        <circle cx="23" cy="45" r="3.1" fill="#fff"/><circle cx="39" cy="45" r="3.1" fill="#fff"/>
      </g>
    </symbol>
  </defs>
</svg>

<header class="top">
  <div class="bar">
    <button class="mini-logo" id="logoBtn" aria-label="Game Shuffle — início">
      <svg><use href="#logo"/></svg><span>Game Shuffle</span>
    </button>
    <nav>
      <button class="nav-btn active" data-view="home">Início</button>
      <button class="nav-btn" data-view="profile">Perfil</button>
    </nav>
  </div>
</header>

<!-- ============ INÍCIO ============ -->
<main id="view-home" class="view active">
  <div class="stage">
    <section class="hero">
      <svg class="logo-big" role="img" aria-label="Logo Game Shuffle"><use href="#logo"/></svg>
      <h1>Game Shuffle</h1>
      <p>Pense menos e jogue mais</p>
    </section>

    <section class="filters">
      <h3>Onde você joga?</h3>
      <div class="chips" id="platChips"></div>
      <h3>Que estilo de jogo?</h3>
      <div class="chips" id="genreChips"></div>
    </section>

    <section class="shuffle-zone">
      <button class="shuffle-btn" id="shuffleBtn">
        <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="4.5" stroke="#fff" stroke-width="1.8"/><circle cx="9" cy="9" r="1.25" fill="#fff"/><circle cx="15" cy="9" r="1.25" fill="#fff"/><circle cx="12" cy="12" r="1.25" fill="#fff"/><circle cx="9" cy="15" r="1.25" fill="#fff"/><circle cx="15" cy="15" r="1.25" fill="#fff"/></svg>
        Sortear jogo
      </button>
      <p class="match-count" id="matchCount"></p>
    </section>

    <h2 class="list-title">Jogos disponíveis</h2>
    <div class="cards" id="cards"></div>
  </div>
</main>

<!-- ============ PERFIL ============ -->
<main id="view-profile" class="view">
  <div class="stage profile">
    <div class="avatar" id="avatar">?</div>
    <h1 id="pName">Visitante</h1>
    <p class="sub" id="pSub">Entre para favoritar jogos. O login é opcional.</p>

    <div id="loginBox" class="login-box">
      <h3>Entrar</h3>
      <p class="hint">Só o nome já basta. E-mail é opcional.</p>
      <div class="field"><label for="nameIn">Nome</label><input id="nameIn" type="text" placeholder="Como podemos te chamar?"></div>
      <div class="field"><label for="mailIn">E-mail <span class="opt">(opcional)</span></label><input id="mailIn" type="email" placeholder="voce@email.com"></div>
      <button class="oval" id="loginBtn">Entrar</button>
    </div>
    <button class="link-btn logout" id="logoutBtn" style="display:none">Sair</button>

    <section class="fav-box">
      <h3>Jogos favoritos</h3>
      <div id="favArea"></div>
    </section>
  </div>
</main>

<footer>Game Shuffle: Steam, Epic Games (CheapShark) e Wikipédia</footer>

<!-- ============ TELA DO JOGO SORTEADO ============ -->
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="result" id="result" role="dialog" aria-modal="true" aria-label="Informações do jogo">
    <button class="close-x" id="closeBtn" aria-label="Fechar">✕</button>
    <div class="r-top">
      <div class="r-cover" id="rCover"></div>
      <div class="r-side">
        <p class="r-kicker" id="rKicker"></p>
        <h2 id="rName"></h2>
        <div class="r-small"><span id="rYear"></span><span class="stars" id="rStars"></span></div>
        <div class="tags" id="rTags"></div>
      </div>
    </div>
    <div class="r-box"><h4>Sinopse</h4><p id="rSyn"></p></div>
    <div class="r-actions">
      <button class="oval" id="againBtn">Sortear outro</button>
      <button class="link-btn" id="favBtn">♡ Favoritar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- banco de dados de jogos + API de capas/informações (ver README.md) -->
<script src="db/games-db.js"></script>
<script src="db/game-api.js"></script>
<script>
(function(){
  "use strict";

  /* dados vêm do banco de jogos (db/games-db.js) através da GameAPI (db/game-api.js) */
  const API    = window.GameAPI;
  const PLATS  = API.plataformas;
  const GENRES = API.generos;
  let   G      = API.jogos();

  const st = {plat:"Todas",genre:"Todos",user:null,favs:new Set(),current:null,rolling:false,hist:[]};
  const $  = (s,c=document)=>c.querySelector(s);
  const $$ = (s,c=document)=>Array.from(c.querySelectorAll(s));

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- helpers visuais ---- */
  function star(f){return `<svg viewBox="0 0 20 20" fill="${f?'#ff7b54':'none'}" stroke="#ff7b54" stroke-width="1.4"><path d="M10 1.8l2.5 5.2 5.7.8-4.1 4 1 5.7L10 14.8 4.9 17.5l1-5.7-4.1-4 5.7-.8L10 1.8z"/></svg>`;}
  function stars(n){let o="";for(let i=1;i<=5;i++)o+=star(i<=n);return o;}
  function initials(n){return n.replace(/[^A-Za-zÀ-ú0-9 ]/g,"").split(" ").filter(w=>w.length>2||/\d/.test(w)).map(w=>w[0]).join("").slice(0,3).toUpperCase();}
  function cover(g,k){
    const h=(g.id*53)%360, h2=(h+28)%360, id="c"+g.id+k;
    return `<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="hsl(${h} 52% 44%)"/><stop offset="1" stop-color="hsl(${h2} 55% 18%)"/></linearGradient></defs>
      <rect width="300" height="400" fill="url(#${id})"/>
      <circle cx="240" cy="70" r="90" fill="rgba(255,255,255,.07)"/>
      <circle cx="40" cy="320" r="120" fill="rgba(0,0,0,.12)"/>
      <text x="150" y="190" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-weight="700" font-size="64" fill="rgba(255,255,255,.92)">${esc(initials(g.n))}</text>
    </svg>${coverImg(g)}`;
  }
  /* capa real: Steam (PC) → Wikipédia (consoles, mobile, arcade) → capa gerada acima */
  function coverImg(g){
    const u=API.capa(g);
    return u ? `<img class="cv" data-gid="${g.id}" src="${esc(u)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">` : "";
  }
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  document.addEventListener("load",e=>{const i=e.target;if(i.classList&&i.classList.contains("cv")){if(i.naturalWidth>i.naturalHeight*1.15)i.classList.add("logo");i.classList.add("ok");}},true);
  document.addEventListener("error",e=>{
    const i=e.target; if(!i.classList||!i.classList.contains("cv"))return;
    nextCover(i);
  },true);
  /* se a capa falhar OU demorar demais (rede bloqueando a fonte), passa para a próxima fonte */
  function nextCover(i){
    clearTimeout(i._t);
    API.marcarFalha(i.getAttribute("src"));
    const next=API.capa(G.find(x=>x.id===Number(i.dataset.gid)));
    if(next){ i.setAttribute("src",next); arm(i); } else i.remove();
  }
  function arm(i){ clearTimeout(i._t); i._t=setTimeout(()=>{ if(i.isConnected&&!i.classList.contains("ok")) nextCover(i); },API.IMG_TIMEOUT+2000); }
  const io="IntersectionObserver" in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); arm(e.target); } }),{rootMargin:"200px"}) : null;
  function watch(){ $$("img.cv:not([data-w])").forEach(i=>{ i.dataset.w="1"; io?io.observe(i):arm(i); }); }
  new MutationObserver(watch).observe(document.body,{childList:true,subtree:true});
  function refreshCovers(){
    $$(".game-card").forEach(c=>{
      const a=$(".art",c), g=G.find(x=>x.id===Number(c.dataset.id)); if(!g)return;
      const im=$("img.cv",a), u=API.capa(g);
      if(!im){ if(u)a.insertAdjacentHTML("beforeend",coverImg(g)); return; }
      if(im.classList.contains("ok"))return;
      if(!u) im.remove();
      else if(im.getAttribute("src")!==u){ im.setAttribute("src",u); delete im.dataset.w; }
    });
    if(st.current&&!st.rolling&&!$("#rCover img.cv.ok")) $("#rCover").innerHTML=cover(st.current,"r");
    watch();
  }
  function heartSvg(on){return `<svg viewBox="0 0 20 20" fill="${on?'#ff7b54':'none'}" stroke="${on?'#ff7b54':'#fff'}" stroke-width="1.5"><path d="M10 17s-6.5-4-6.5-8.5C3.5 5.8 5.3 4 7.5 4c1.2 0 2.1.6 2.5 1.4C10.4 4.6 11.3 4 12.5 4c2.2 0 4 1.8 4 4.5C16.5 13 10 17 10 17z"/></svg>`;}

  /* ---- filtros ---- */
  function filtered(){
    return G.filter(g=>(st.plat==="Todas"||g.p.includes(st.plat)) && (st.genre==="Todos"||g.g.includes(st.genre)));
  }
  function renderChips(){
    $("#platChips").innerHTML  = ["Todas",...PLATS].map(p=>`<button class="chip${st.plat===p?' on':''}" data-plat="${p}">${p}</button>`).join("");
    $("#genreChips").innerHTML = ["Todos",...GENRES].map(x=>`<button class="chip${st.genre===x?' on':''}" data-genre="${x}">${x}</button>`).join("");
  }
  $("#platChips").addEventListener("click",e=>{const b=e.target.closest("[data-plat]");if(!b)return;st.plat=b.dataset.plat;renderChips();renderCards();});
  $("#genreChips").addEventListener("click",e=>{const b=e.target.closest("[data-genre]");if(!b)return;st.genre=b.dataset.genre;renderChips();renderCards();});

  /* ---- cards ---- */
  function cardHtml(g){
    const on=st.favs.has(g.id);
    return `<article class="game-card" tabindex="0" role="button" data-id="${g.id}" aria-label="${esc(g.n)}, ${g.y}. Ver sinopse">
      <div class="art">${cover(g,"a")}</div>
      <button class="heart" data-heart="${g.id}" aria-label="Favoritar ${esc(g.n)}">${heartSvg(on)}</button>
      <div class="info"><h3>${esc(g.n)}</h3><div class="row"><span class="yr">${g.y}</span><span class="stars">${stars(g.s)}</span></div></div>
    </article>`;
  }
  function bindCards(root){
    root.addEventListener("click",e=>{
      const h=e.target.closest("[data-heart]");
      if(h){e.stopPropagation();toggleFav(Number(h.dataset.heart));return;}
      const c=e.target.closest(".game-card");
      if(c)openGame(G.find(x=>x.id===Number(c.dataset.id)),"Sobre o jogo");
    });
    root.addEventListener("keydown",e=>{
      if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("game-card")){
        e.preventDefault();openGame(G.find(x=>x.id===Number(e.target.dataset.id)),"Sobre o jogo");
      }
    });
  }
  function renderCards(){
    const l=filtered();
    $("#cards").innerHTML = l.length ? l.map(cardHtml).join("") : `<p class="empty"><strong>Nenhum jogo com essa combinação</strong>Tente outra plataforma ou outro estilo.</p>`;
    $("#matchCount").textContent = l.length===0 ? "Nenhum jogo combina com os filtros" : l.length+(l.length===1?" jogo combina":" jogos combinam")+" com o que você escolheu";
  }
  bindCards($("#cards"));
  bindCards($("#favArea"));

  /* ---- tela do jogo ---- */
  function fill(g,kicker){
    $("#rCover").innerHTML=cover(g,"r");
    $("#rKicker").textContent=kicker;
    $("#rName").textContent=g.n;
    $("#rYear").textContent=g.y;
    $("#rStars").innerHTML=stars(g.s);
    $("#rTags").innerHTML=[...g.p,...g.g,...(g.lojas||[])].map(t=>`<span class="tag">${esc(t)}</span>`).join("");
    $("#rSyn").textContent=g.t||"Carregando sinopse…";
    if(!g.t && !st.rolling) API.info(g).then(i=>{ if(st.current===g){ g.t=i.sinopse; $("#rSyn").textContent=i.sinopse||"Sinopse indisponível."; } });
    syncFav();
  }
  function syncFav(){
    if(!st.current)return;
    $("#favBtn").textContent = st.favs.has(st.current.id) ? "♥ Favoritado" : "♡ Favoritar";
  }
  function show(){ $("#overlay").classList.add("show"); $("#overlay").setAttribute("aria-hidden","false"); }
  function hide(){ if(st.rolling)return; $("#overlay").classList.remove("show"); $("#overlay").setAttribute("aria-hidden","true"); }
  function openGame(g,kicker){ st.current=g; fill(g,kicker); show(); }

  function roll(){
    if(st.rolling)return;
    const l=filtered();
    if(!l.length){toast("Nenhum jogo combina com esses filtros");return;}
    let pick=API.sortear({lista:l,favoritos:[...st.favs],evitar:st.hist,atual:st.current&&st.current.id});
    st.hist=[...st.hist,pick.id].slice(-6);
    st.rolling=true; $("#againBtn").disabled=true; $("#result").classList.add("rolling");
    show();
    const finish=()=>{
      st.rolling=false; $("#againBtn").disabled=false; $("#result").classList.remove("rolling");
      st.current=pick; fill(pick,"Seu próximo jogo é…");
    };
    if(reduceMotion||l.length===1){finish();return;}
    let n=0;
    const tick=setInterval(()=>{
      const r=l[Math.floor(Math.random()*l.length)];
      st.current=r; fill(r,"Sorteando…");
      if(++n>=12){clearInterval(tick);finish();}
    },75);
  }

  /* ---- favoritos / login ---- */
  function toggleFav(id){
    if(!st.user){toast("Faça login no Perfil para favoritar");return;}
    st.favs.has(id)?st.favs.delete(id):st.favs.add(id);
    renderCards();renderProfile();syncFav();
  }
  function renderProfile(){
    const u=st.user;
    $("#loginBox").style.display=u?"none":"block";
    $("#logoutBtn").style.display=u?"block":"none";
    $("#avatar").textContent=u?u.name[0].toUpperCase():"?";
    $("#pName").textContent=u?u.name:"Visitante";
    $("#pSub").textContent=u?(u.email||"Sem e-mail cadastrado"):"Entre para favoritar jogos. O login é opcional.";
    const f=G.filter(g=>st.favs.has(g.id));
    $("#favArea").innerHTML = !u
      ? `<p class="empty"><strong>Você ainda não entrou</strong>Faça login para guardar seus jogos favoritos aqui.</p>`
      : f.length ? `<div class="cards">${f.map(cardHtml).join("")}</div>`
      : `<p class="empty"><strong>Nenhum favorito ainda</strong>Toque no coração de um jogo para guardá-lo aqui.</p>`;
  }
  $("#loginBtn").addEventListener("click",()=>{
    const name=$("#nameIn").value.trim();
    if(!name){toast("Digite pelo menos um nome");return;}
    st.user={name,email:$("#mailIn").value.trim()};
    renderProfile();toast("Bem-vindo(a), "+name.split(" ")[0]+"!");
  });
  $("#logoutBtn").addEventListener("click",()=>{st.user=null;renderProfile();});

  /* ---- navegação ---- */
  function setView(v){
    $$(".view").forEach(x=>x.classList.toggle("active",x.id==="view-"+v));
    $$(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
    window.scrollTo(0,0);
  }
  $$(".nav-btn").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
  $("#logoBtn").addEventListener("click",()=>setView("home"));

  $("#shuffleBtn").addEventListener("click",roll);
  $("#againBtn").addEventListener("click",roll);
  $("#favBtn").addEventListener("click",()=>{ if(st.current) toggleFav(st.current.id); });
  $("#closeBtn").addEventListener("click",hide);
  $("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")hide();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")hide();});

  let tt;
  function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200);}

  renderChips();renderCards();renderProfile();

  /* ---- banco de jogos: atualiza a tela quando a API importa jogos ou encontra capas ---- */
  window.addEventListener("gamedb:change",()=>{ G=API.jogos(); renderCards(); renderProfile(); });
  window.addEventListener("gamedb:covers",refreshCovers);
  window.addEventListener("gamedb:fontes",refreshCovers);
  watch();
  API.testarFontes();
  API.carregarCapas();
})();
</script>
</body>
</html>
